<!DOCTYPE html>
<html>
<head>
    <title>Delete Book - School Library</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'mainapp/css/style.css' %}">
</head>

<body>

<div class="account-bar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'profile' %}">My Account</a>
</div>

<div class="container">
    <h1>Delete Book</h1>

    <p>Are you sure you want to delete:</p>

    <h2>{{ book.title }}</h2>
    <p>Author: {{ book.author }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Book</button>
        <a href="{% url 'profile' %}">Cancel</a>
    </form>
</div>

</body>
</html>

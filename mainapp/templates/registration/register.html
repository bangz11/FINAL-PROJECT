{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | School Library</title>
    <link rel="stylesheet" href="{% static 'mainapp/css/style.css' %}">
</head>

<body>

<header>
    <h1>School Library</h1>
</header>

<main>
    <h2>Create Your Library Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

    <p>
        <a href="{% url 'home' %}">Back to Library</a>
    </p>
</main>

</body>
</html>
